<html lang="en">
<head>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet"
    >

    <script>
        try {
            var t = localStorage.getItem("napl_theme_v1");
            if (t === "light" || t === "dark") {
                document.documentElement.setAttribute("data-theme", t);
            }
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/css/main.css?v=5">

<body class="home-page">

<header>
    <button
        id="menu-button"
        type="button"
        aria-label="Open menu"
        aria-controls="side-menu"
        aria-expanded="false"
    >
        ☰
    </button>

    <h1 id="home-button" role="button" tabindex="0">NAPL</h1>

    <div class="header-actions">
        <button
            id="theme-toggle"
            type="button"
            aria-label="Switch to light mode"
            aria-pressed="false"
        ></button>

        <button
            id="search-button"
            type="button"
            aria-label="Open search"
            aria-controls="search-container"
            aria-expanded="false"
        >
            <svg
                class="search-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
            </svg>
        </button>
    </div>
</header>

<div id="menu-overlay" aria-hidden="true"></div>

<nav id="side-menu" aria-label="Main navigation" aria-hidden="true">
    <button id="menu-close" type="button" aria-label="Close menu">×</button>

    <h2>Games</h2>

    <button id="all-games-button" type="button" class="platform-button">
        All Games
    </button>

    <h2>Categories</h2>

    <div id="platform-list" aria-live="polite"></div>
</nav>

<main>
    <div id="search-container" class="search-container" hidden>
        <input
            type="text"
            id="search"
            placeholder="Search games..."
            autocomplete="off"
            aria-label="Search games"
        >
        <div id="search-results" class="search-results" role="list" hidden></div>
    </div>

    <div id="category-controls" class="category-controls" hidden>
        <input
            type="text"
            id="category-search"
            placeholder="Search in this category..."
            autocomplete="off"
            aria-label="Search in this category"
        >

        <div class="category-sort">
            <button type="button" class="category-sort-option active" data-sort="updated">
                Last Updated
            </button>
            <button type="button" class="category-sort-option" data-sort="name">
                A–Z
            </button>
            <button type="button" class="category-sort-option" data-sort="popular">
                Popular
            </button>
            <button
                type="button"
                id="category-sort-direction"
                class="category-sort-direction"
                aria-label="Change sort direction"
            >
                ↓
            </button>
        </div>
    </div>

    <nav id="home-tabs" class="home-tabs" role="tablist" aria-label="Home sections">
        <button
            id="tab-last-added"
            class="home-tab active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="last-added-section"
            data-section="last-added"
        >
            Last Added
        </button>
        <button
            id="tab-popular"
            class="home-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="popular-section"
            data-section="popular"
            tabindex="-1"
        >
            Popular
        </button>
        <button
            id="tab-last-updated"
            class="home-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="last-updated-section"
            data-section="last-updated"
            tabindex="-1"
        >
            Last Updated
        </button>
    </nav>

    <section
        id="last-added-section"
        class="home-section"
        role="tabpanel"
        aria-labelledby="tab-last-added"
    >
        <div id="last-added-list" class="home-game-list"></div>
        <button id="last-added-more" class="home-view-more" type="button" hidden>
            View more →
        </button>
    </section>

    <section
        id="popular-section"
        class="home-section"
        role="tabpanel"
        aria-labelledby="tab-popular"
        hidden
    >
        <div class="home-section-header">
            <div class="popular-tabs" aria-label="Popularity period">
                <button class="popular-tab active" data-period="week" type="button" aria-pressed="true">
                    Week
                </button>
                <button class="popular-tab" data-period="month" type="button" aria-pressed="false">
                    Month
                </button>
                <button class="popular-tab" data-period="alltime" type="button" aria-pressed="false">
                    All Time
                </button>
            </div>
        </div>
        <div id="popular-list" class="home-game-list"></div>
        <button id="popular-more" class="home-view-more" type="button">
            View more →
        </button>
    </section>

    <section
        id="last-updated-section"
        class="home-section"
        role="tabpanel"
        aria-labelledby="tab-last-updated"
        hidden
    >
        <div id="last-updated-list" class="home-game-list"></div>
        <button id="last-updated-more" class="home-view-more" type="button" hidden>
            View more →
        </button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="game-list" hidden></div>
</main>

<footer>
    <p>Native Android Port List</p>
</footer>

<script type="module" src="js/pages/home.js"></script>

</body>
</html>
